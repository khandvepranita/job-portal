version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: jobportal_mysqldb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD environment variable is required}
      MYSQL_DATABASE: ${DB_NAME:-jobportal_db}
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: jobportal_backend
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/${DB_NAME:-jobportal_db}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD environment variable is required}
      APP_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET environment variable is required}
    depends_on:
      - mysqldb

  frontend:
    build: ./frontend
    container_name: jobportal_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
