# Application Configuration
spring.application.name=job-portal-backend
server.port=${PORT:8081}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobportal_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVBbmRTdHJvbmdLZXlGb3JKV1RUb2tlblNpZ25pbmcxMjM0NTY=}
app.jwt.expiration-ms=604800000
# 7 days (604800000 ms)
app.jwt.refresh-expiration-ms=604800000
# 7 days (604800000 ms)
app.jwt.cookie-name=jobportal_jwt
app.jwt.refresh-cookie-name=jobportal_refresh

# OpenAPI / Swagger Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.jobportal.backend=DEBUG
