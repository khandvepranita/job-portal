# H2 In-Memory Fallback Configuration (Development / Testing Profile)
spring.application.name=job-portal-backend
server.port=${PORT:8081}

# H2 Database Setup (In-Memory MySQL Emulation)
spring.datasource.url=jdbc:h2:mem:jobportal_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Settings for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=never

# JWT Security Configuration (With built-in dev fallback secret)
app.jwt.secret=${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVBbmRTdHJvbmdLZXlGb3JKV1RUb2tlblNpZ25pbmcxMjM0NTY=}
app.jwt.expiration-ms=604800000
# 7 days (604800000 ms)
app.jwt.refresh-expiration-ms=604800000
app.jwt.cookie-name=jobportal_jwt
app.jwt.refresh-cookie-name=jobportal_refresh

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
